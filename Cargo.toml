[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/account", "crates/storage", "xtask"]
exclude = [".temp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Capybara-sea/moongazer"
publish = false

[workspace.dependencies]
account = { path = "crates/account" }
anyhow = "1.0"
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
log = { version = "0.4.35", features = ["max_level_info", "release_max_level_info"] }
# The packet monitor bindings Teyvat.me Capture captures with, from the same
# repository and tag as its decoding crates (see those). Without `tokio`:
# capture runs on plain threads here.
pktmon = { git = "https://github.com/tawan475/teyvat.me-capture", tag = "v1.17.32" }
# No default features: they add a statement cache and a WebAssembly VFS.
# `fallible_uint` stores u64 values, failing on any above i64::MAX.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "fallible_uint"] }
# Built exactly as tauri-plugin-updater builds them: rustls with ring, which
# must be installed as the crypto provider before a client is built.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
# `all` has the raw socket type the compatible capture opens.
socket2 = { version = "0.6", features = ["all"] }
storage = { path = "crates/storage" }
# Keep the Rust and JS halves of Tauri on the same minor version.
# The tray icon keeps the app running with its window closed.
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-build = "~2.7"
tauri-plugin-decorum = "~1.1"
tauri-plugin-notification = "~2.8"
tauri-plugin-opener = "~2.7"
tauri-plugin-single-instance = "~2.5"
tauri-plugin-updater = "~2.14"
# Teyvat.me Capture's decoding crates, behind the `capture` feature. Each is
# named once, with one URL and one tag: spelled any other way, Cargo would
# take the crates they share for a second source and the types would not
# match. Without default features game-data has no downloader (and no second
# reqwest).
teyvatme-core = { git = "https://github.com/tawan475/teyvat.me-capture", tag = "v1.17.32", default-features = false }
teyvatme-game-data = { git = "https://github.com/tawan475/teyvat.me-capture", tag = "v1.17.32", default-features = false }
teyvatme-protocol = { git = "https://github.com/tawan475/teyvat.me-capture", tag = "v1.17.32", default-features = false }
# Only for the channel type teyvatme-core's decoder sends its events on.
tokio = { version = "1.47", default-features = false, features = ["sync"] }
toml_edit = "0.25"
# Account data reaches trace and debug logs in upstream crates, so nothing
# above info is compiled in. Every crate that links them must also depend on
# tracing and log directly, so these features apply in every build.
tracing = { version = "0.1.44", features = ["max_level_info", "release_max_level_info"] }
tracing-appender = "0.2.5"
# No `env-filter`: the log level must not be raised from the environment.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "tracing-log"] }
# For the raw socket capture copied from Teyvat.me Capture, which upstream
# builds on 0.61; 0.62 is the version Tauri already brings in.
windows = { version = "0.62", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# As upstream's own workspace does: the session key search in the protocol
# crate tries up to 3000 x 1000 seeds and crawls unoptimized.
[profile.dev.package.teyvatme-protocol]
opt-level = 2

[profile.dev.package.teyvatme-game-data]
opt-level = 2
