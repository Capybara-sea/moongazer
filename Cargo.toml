[workspace]
resolver = "3"
members = ["xtask"]
exclude = [".temp"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Capybara-sea/moongazer"
publish = false

[workspace.dependencies]
anyhow = "1.0"
serde_json = "1.0"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
