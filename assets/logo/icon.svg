    <filter id="soft6" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#bgLift)"/>
  <rect x="9" y="9" width="1006" height="1006" rx="215" fill="none" stroke="#a3acdc" stroke-opacity="0.26" stroke-width="18"/>

  <circle cx="214" cy="196" r="12" fill="#e1e8f4" opacity="0.8"/>
  <circle cx="872" cy="182" r="9" fill="#e1e8f4" opacity="0.65"/>
  <g class="mg-star">
    <g transform="translate(842 836) scale(1.2)">
        <circle r="48" fill="url(#starGlow)"/>
        <path d="M0 -100 Q2 -18 9 0 Q2 18 0 100 Q-2 18 -9 0 Q-2 -18 0 -100Z M-100 0 Q-18 -2 0 -9 Q18 -2 100 0 Q18 2 0 9 Q-18 2 -100 0Z" fill="#abbde2" opacity="0.6" filter="url(#soft6)"/>
        <path d="M0 -100 Q1 -14 5 0 Q1 14 0 100 Q-1 14 -5 0 Q-1 -14 0 -100Z M-100 0 Q-14 -1 0 -5 Q14 -1 100 0 Q14 1 0 5 Q-14 1 -100 0Z" fill="#f6f8fc" opacity="0.95" filter="url(#soft3)"/>
        <path d="M0 -40 Q0.8 -8 3 0 Q0.8 8 0 40 Q-0.8 8 -3 0 Q-0.8 -8 0 -40Z M-40 0 Q-8 -0.8 0 -3 Q8 -0.8 40 0 Q8 0.8 0 3 Q-8 0.8 -40 0Z" fill="#e1e8f4" opacity="0.65" transform="rotate(45)" filter="url(#soft3)"/>
        <circle r="14" fill="#ffffff" opacity="0.75" filter="url(#soft6)"/>
        <circle r="6" fill="#ffffff" filter="url(#soft3)"/>
    </g>
  </g>

  <circle class="mg-halo" cx="582" cy="500" r="348" fill="url(#halo)"/>

  <g class="mg-discs" filter="url(#backSoft)">
    <circle cx="502" cy="535.6" r="374" fill="url(#back1)"/>
    <circle cx="542" cy="502.8" r="318" fill="url(#back2)"/>
  </g>

  <g class="mg-moon">
    <circle cx="582" cy="500" r="228" fill="url(#moonFill)"/>
    <g clip-path="url(#moonClip)">
      <ellipse cx="524" cy="460" rx="66" ry="46" transform="rotate(-18 524 460)" fill="#a7b7d6" opacity="0.36" filter="url(#maria)"/>
      <ellipse cx="638" cy="544" rx="86" ry="54" transform="rotate(24 638 544)" fill="#a1b0d2" opacity="0.32" filter="url(#maria)"/>
      <ellipse cx="552" cy="610" rx="42" ry="28" fill="#afbddb" opacity="0.3" filter="url(#maria)"/>
    </g>
    <circle cx="582" cy="500" r="225" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.85"/>
