<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333d6d"/>
      <stop offset="0.55" stop-color="#242e56"/>
      <stop offset="1" stop-color="#19213d"/>
    </linearGradient>
    <radialGradient id="bgLift" cx="582" cy="500" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#434e82" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#434e82" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="582" cy="500" r="296" gradientUnits="userSpaceOnUse">
      <stop offset="0.77" stop-color="#96b2dd" stop-opacity="0.6"/>
      <stop offset="0.87" stop-color="#8aa9d9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8aa9d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonFill" cx="0.4" cy="0.36" r="0.68">
      <stop offset="0" stop-color="#f9fbfd"/>
      <stop offset="0.4" stop-color="#eef3f9"/>
      <stop offset="0.78" stop-color="#d1dcef"/>
      <stop offset="1" stop-color="#abbde2"/>
    </radialGradient>
    <linearGradient id="back1" x1="843.7" y1="383.5" x2="160.3" y2="687.7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8aa9d9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8aa9d9" stop-opacity="0.146"/>
      <stop offset="0.75" stop-color="#c0cfe9" stop-opacity="0.248"/>
      <stop offset="1" stop-color="#e4eaf5" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="back2" x1="859.2" y1="480.6" x2="224.8" y2="525" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8aa9d9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8aa9d9" stop-opacity="0.211"/>
      <stop offset="0.75" stop-color="#c0cfe9" stop-opacity="0.358"/>
      <stop offset="1" stop-color="#e4eaf5" stop-opacity="0.52"/>
    </linearGradient>
    <clipPath id="moonClip"><circle cx="582" cy="500" r="228"/></clipPath>
    <filter id="backSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="maria" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="starGlow">
