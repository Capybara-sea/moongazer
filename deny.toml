[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
ignore = [
    # The Marvin attack on rsa 0.9, which teyvatme-protocol decrypts the login
    # exchange with. The keys are the game client's own, published upstream,
    # and decryption runs offline on packets already captured, so there is no
    # secret to time. Remove once upstream moves to rsa 0.10.
    "RUSTSEC-2023-0071",
    # chrono is unmaintained, not vulnerable. teyvatme-core depends on it and
    # there is no maintained release to move to.
    "RUSTSEC-2026-0543",
]

[licenses]
# Grows with the dependency tree. Check a new license against MIT before
# adding it here. MPL-2.0 (cssparser, selectors and friends, through Tauri) is
# file-level copyleft: fine unmodified, but the notices must say where their
# source is available.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "tag"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tawan475/teyvat.me-capture"]
