[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `cargo xtask pack`, which builds the game database with an upstream crate.
# The `cargo xtask` alias turns it on.
capture = ["dep:flate2", "dep:log", "dep:teyvatme-game-data", "dep:tracing"]

[dependencies]
anyhow.workspace = true
flate2 = { workspace = true, optional = true }
log = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
teyvatme-game-data = { workspace = true, optional = true }
toml_edit.workspace = true
tracing = { workspace = true, optional = true }
zip = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
